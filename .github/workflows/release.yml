name: Release

# A stable GitHub Release is the publication boundary. The first job verifies the
# immutable tagged source without publish credentials and hands the exact tarball
# across as an immutable workflow artifact. Only then can the protected npm
# environment approve a minimal job that obtains a short-lived OIDC credential.
# No publish token or local npm login is used.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: safeseed-npm-release
  cancel-in-progress: false

jobs:
  verify-release:
    if: ${{ github.event.release.prerelease == false }}
    outputs:
      package-filename: ${{ steps.package.outputs.filename }}
      package-sha256: ${{ steps.package.outputs.sha256 }}
      artifact-digest: ${{ steps.upload-package.outputs.artifact-digest }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify the stable Release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IMMUTABLE: ${{ github.event.release.immutable }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable releases must use an exact vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag resolves to $TAG_COMMIT, but the release event identifies $GITHUB_SHA."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not on origin/main."
            exit 1
          fi

          if [[ "$RELEASE_IMMUTABLE" != "true" ]]; then
            echo "::error::The published GitHub Release is not immutable."
            exit 1
          fi

          SUCCESSFUL_RUNS="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=${GITHUB_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$SUCCESSFUL_RUNS" -lt 1 ]]; then
            echo "::error::No successful main-branch CI run exists for release commit $GITHUB_SHA."
            exit 1
          fi

          echo "Release source verified: safeseed@$PACKAGE_VERSION at $GITHUB_SHA"

      - run: npm ci

      - name: Audit, typecheck, test, build, and verify release alignment
        run: npm run release:check

      - name: Verify the committed Action build is fresh
        run: npm run check:release -- --require-clean-dist

      - name: Inspect the package payload
        run: npm pack --dry-run --json --ignore-scripts

      - name: Require unchanged verified source
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$STATUS" ]]; then
            echo "::error::Release checks changed or created repository files."
            printf '%s\n' "$STATUS"
            exit 1
          fi

      - name: Pack the verified release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          PACK_JSON="$RUNNER_TEMP/npm-pack.json"
          npm pack --json --ignore-scripts > "$PACK_JSON"
          cat "$PACK_JSON"

          PACKAGE_FILENAME="$(node -e 'const fs=require("fs"); const result=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(result[0].filename);' "$PACK_JSON")"
          EXPECTED_FILENAME="safeseed-$(node -p "require('./package.json').version").tgz"
          if [[ "$PACKAGE_FILENAME" != "$EXPECTED_FILENAME" || ! -f "$PACKAGE_FILENAME" ]]; then
            echo "::error::npm packed '$PACKAGE_FILENAME'; expected '$EXPECTED_FILENAME'."
            exit 1
          fi

          PACKAGE_SHA256="$(sha256sum "$PACKAGE_FILENAME" | awk '{print $1}')"
          echo "filename=$PACKAGE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$PACKAGE_SHA256" >> "$GITHUB_OUTPUT"
          echo "Verified package: $PACKAGE_FILENAME ($PACKAGE_SHA256)"

      - name: Preserve the exact verified package
        id: upload-package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safeseed-npm-package
          path: ${{ steps.package.outputs.filename }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify-release
    if: ${{ github.event.release.prerelease == false }}
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # This job can mint a publish credential. Do not restore a dependency
          # cache that untrusted lifecycle code could poison before publication.
          package-manager-cache: false

      - name: Retrieve the exact verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: safeseed-npm-package
          path: release-package

      - name: Reconfirm source and package identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_FILENAME: ${{ needs.verify-release.outputs.package-filename }}
          PACKAGE_SHA256: ${{ needs.verify-release.outputs.package-sha256 }}
          ARTIFACT_DIGEST: ${{ needs.verify-release.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" || "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Protected publish source no longer matches the verified Release."
            exit 1
          fi

          EXPECTED_FILENAME="safeseed-${PACKAGE_VERSION}.tgz"
          PACKAGE_PATH="release-package/$PACKAGE_FILENAME"
          mapfile -t DOWNLOADED_FILES < <(find release-package -maxdepth 1 -type f -print)
          if [[ "$PACKAGE_FILENAME" != "$EXPECTED_FILENAME" || ${#DOWNLOADED_FILES[@]} -ne 1 || "${DOWNLOADED_FILES[0]}" != "$PACKAGE_PATH" ]]; then
            echo "::error::Protected publish job received an unexpected package payload."
            printf 'Downloaded: %s\n' "${DOWNLOADED_FILES[@]:-none}"
            exit 1
          fi

          ACTUAL_SHA256="$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"
          if [[ ! "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ || "$ACTUAL_SHA256" != "$PACKAGE_SHA256" ]]; then
            echo "::error::Downloaded package digest does not match the verified package."
            exit 1
          fi
          if [[ ! "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The immutable workflow artifact did not report a SHA-256 digest."
            exit 1
          fi
          echo "Protected package identity confirmed: $PACKAGE_FILENAME ($ACTUAL_SHA256)"

      # Trusted publishing exchanges GitHub's short-lived OIDC token for publish
      # access and automatically attaches provenance for this public repository.
      # The privileged job installs no dependencies and --ignore-scripts prevents
      # package lifecycle code from running while an OIDC credential is available.
      - name: Publish to npm
        env:
          PACKAGE_FILENAME: ${{ needs.verify-release.outputs.package-filename }}
        run: npm publish "release-package/$PACKAGE_FILENAME" --access public --ignore-scripts
